services:
  aibot:
    restart: no
    build: .
    container_name: py311_unchain_aiaw
    ports:
      - "5160:5160"
    tty: true
    volumes:
      - env_aibot:/var/docker-service/unchain-aiaw/env
      - ../unchain-aiaw:/var/docker-service/unchain-aiaw
      - ../logs:/var/log
      - ${HOST_KEY_PATH:-~/.ssh/uw_private_key.pem}:/app/secret/uw_private_key.pem:ro
    environment:
      - PROJECT_ROOT=/var/docker-service/unchain-aiaw
      - CONFIG_FILE_NAME=unchain-aiaw.json
      - GCP_CONFIG_FILE_NAME=gcp_config-prod.json
      - WIF_PRIVATE_KEY_PATH=/app/secret/uw_private_key.pem
    networks:
      - docker-container_default
volumes:
  env_aibot:
networks:
  docker-container_default:
    external: true
